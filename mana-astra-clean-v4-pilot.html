<!doctype html><html lang="ja"><meta charset="utf-8"><title>Mana v4 three-state pilot</title><style>body{margin:0;background:#070b12;color:#abbccd;font:14px sans-serif}canvas{width:788px;height:300px;display:block}p{margin:12px}</style><p>マナ v4 / 三状態の造形試験・採用前　H100 / H64</p><canvas id="stage"></canvas><p id="status"></p><script src="webgpu-mana-astra-clean-v4-pilot.js"></script><script>
(async()=>{let raf=0,alive=true;try{const r=await ManaV4Pilot.renderer(document.getElementById('stage'));const q=new URLSearchParams(location.search),states=[.2,.65,1.1],hold=900,mode=q.has('noGlow')?1:0;let last=0,index=-1;window.pilot={r,states,dispose(){if(!alive)return;alive=false;cancelAnimationFrame(raf);r.dispose();}};function frame(now){if(!alive)return;if(!last||now-last>=hold){index=(index+1)%states.length;last=now;document.getElementById('status').textContent=`マナ v4 / 状態 ${index+1}/3 · t=${states[index].toFixed(2)}秒 · SFX・全寿命・ゲーム接続なし`; }try{r.draw(states[index],{mode});raf=requestAnimationFrame(frame);}catch(e){alive=false;document.documentElement.dataset.ready='error';document.getElementById('status').textContent=String(e.stack||e);r.dispose();}}raf=requestAnimationFrame(frame);document.documentElement.dataset.ready='true';addEventListener('pagehide',()=>pilot.dispose(),{once:true});}catch(e){alive=false;cancelAnimationFrame(raf);document.documentElement.dataset.ready='error';document.getElementById('status').textContent=String(e.stack||e);}})();
</script></html>
