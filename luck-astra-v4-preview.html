<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>幸運 v4 独立検証</title>
<style>html{color-scheme:dark;background:#10151b;color:#c2cbd4;font:15px system-ui}body{margin:0}main{max-width:920px;margin:32px auto;padding:0 24px}h1{font-size:20px;font-weight:500}p{color:#8999a8;font-size:13px}canvas{display:block;width:100%;height:390px;border:1px solid #30404f;border-radius:8px}#status{font-size:12px}body.embed main{margin:0;padding:0}body.embed h1,body.embed p{display:none}@media(max-width:600px){canvas{height:320px}}</style>
<main><h1>幸運 v4 — 未確定の自分から、ひとつの状態へ</h1><p>独立検証版・ゲーム未接続。受け手は寸法校正用の仮形状です。</p><canvas aria-label="幸運v4自動ループ"></canvas><p id="status">WebGPUを準備しています</p></main>
<script src="webgpu-luck-astra-v4.js"></script><script>
(async()=>{const params=new URLSearchParams(location.search);if(params.has('embed'))document.body.classList.add('embed');const status=document.querySelector('#status');try{window.luckV4=await LuckAstraV4.create(document.querySelector('canvas'),{height:Number(params.get('height')||100),duration:Number(params.get('duration')||1500),reduced:params.has('reduced'),onError:message=>{document.body.dataset.gpu='error';status.textContent=message;}});document.body.dataset.gpu='ready';document.body.dataset.edition=luckV4.edition;status.textContent=`H${params.get('height')||100} CSS px / ${luckV4.silent?'検証モード・無音':'ブラウザーの再生条件に従います'} / 品質未受入`;}catch(e){document.body.dataset.gpu='error';status.textContent=e.message;}})();
</script></html>
