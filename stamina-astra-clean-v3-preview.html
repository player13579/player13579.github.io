<main><h1>スタミナ補給</h1><p>Astra clean v3 · 足元から体幹への力の受け渡し · 自動ループ</p><canvas></canvas><div class="sizes"><span>キャラ高 100px</span><span>キャラ高 64px</span></div><p id="status">描画準備中</p></main>
<script src="webgpu-stamina-astra-clean-v3.js"></script><script>
(async()=>{const query=new URLSearchParams(location.search),verify=query.has('verify');let context=null;if(!verify){const AC=window.AudioContext||window.webkitAudioContext;if(AC){context=new AC();addEventListener('pointerdown',()=>context.resume(),{once:true});}}
 const renderer=await DvaStaminaAstraCleanV3.createRenderer(document.querySelector('canvas')),audio=DvaStaminaAstraCleanV3.createAudio({context,verify}),reduced=query.has('reduced')||matchMedia('(prefers-reduced-motion:reduce)').matches;let fixed=null,running=true,last=-1;const start=performance.now();
 const state=window.staminaPreviewV3={renderer,audio,reduced,verify,frames:0,phase:0,async setTime(ms){fixed=ms;await draw(ms,false);},resume(){fixed=null;},dispose(){running=false;audio.dispose();renderer.dispose();if(context)context.close();}};
 async function draw(time,withAudio){const cycle=Math.floor(time/2800),age=time%2800,p=age<1500?age/1500:1;await renderer.draw(p,{width:Math.min(680,document.documentElement.clientWidth),height:280,dpr:devicePixelRatio,reduced});state.frames++;state.phase=p;if(withAudio&&cycle!==last){if(last>=0)audio.stop('p'+last);last=cycle;audio.start('p'+cycle,age);}}
 async function frame(){if(!running)return;await draw(fixed===null?performance.now()-start:fixed,fixed===null);requestAnimationFrame(frame);}await frame();document.body.dataset.ready='true';document.querySelector('#status').textContent='品質不採用の検証記録・本編未接続。音はブラウザーの再生条件に従います。';addEventListener('pagehide',state.dispose,{once:true});
})().catch(error=>{document.body.dataset.error=error.message;document.querySelector('#status').textContent=error.message;console.error(error);});
</script></html>
