<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>幸運 / Astra v3</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#101720;color:#d4dce2;font-family:system-ui,sans-serif}main{max-width:920px;margin:auto;padding:28px 24px}h1{margin:0 0 9px;font-size:20px;font-weight:500}p{margin:0;color:#82919e;font-size:12px;line-height:1.8}canvas{display:block;width:100%;height:390px;margin:18px 0;border:1px solid #263443;border-radius:9px}body.embed main{padding:0}body.embed h1,body.embed p{display:none}body.embed canvas{height:100vh;margin:0;border:0;border-radius:0}@media(max-width:520px){main{padding:18px 12px}canvas{height:320px}}</style></head>
<body><main><h1>幸運 / Astra v3</h1><p>候補・本編未接続 / 自動ループ</p><canvas id="effect" aria-label="複数の進路が分かれ、その一本が身体へ届く幸運の試作"></canvas><p id="state">WebGPUを準備しています</p><p>受け手は寸法確認用のシルエットです。</p></main>
<script src="webgpu-luck-astra-v3.js"></script><script>
const q=new URLSearchParams(location.search);if(q.has('embed'))document.body.className='embed';
const statusLine=document.getElementById('state');const lifetime=Number(q.get('duration'))||1500;
LuckAstraV3.attach(document.getElementById('effect'),{height:Number(q.get('height'))||100,durationMs:lifetime,reduced:q.has('reduced')||matchMedia('(prefers-reduced-motion: reduce)').matches,onError:message=>{document.body.dataset.gpu='error';statusLine.textContent=message;}}).then(runtime=>{window.luckV3=runtime;document.body.dataset.gpu='ready';document.body.dataset.edition=runtime.edition;statusLine.textContent=runtime.verify?'WebGPU / verify・音声0固定':'WebGPU / 音声はブラウザーの再生条件に従います';addEventListener('pagehide',()=>runtime.destroy(),{once:true});}).catch(e=>{document.body.dataset.gpu='error';statusLine.textContent=e.message;});
</script></body></html>
