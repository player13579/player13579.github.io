<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mana Astra v5 isolated three-state pilot — unaccepted</title><link rel="icon" href="data:,">
<style>html,body{margin:0;background:#030507;color:#c6ced7;font:12px system-ui}#stage{position:relative;width:360px;height:240px}canvas{position:absolute;inset:0;display:block;width:360px;height:240px;opacity:0;transition:none}canvas.active{opacity:1}#label{position:absolute;left:12px;top:10px;white-space:pre-line;pointer-events:none}#error{position:absolute;left:12px;top:45px;color:#ff967a;max-width:335px;white-space:pre-wrap}</style>
<div id="stage"><canvas width="360" height="240" class="active"></canvas><canvas width="360" height="240"></canvas><canvas width="360" height="240"></canvas></div><div id="label"></div><div id="error"></div>
<script src="webgpu-mana-astra-v5-pilot.js"></script>
<script>
(async()=>{'use strict';const q=new URLSearchParams(location.search),phases=DvaManaV5Pilot.PHASES,canvases=[...document.querySelectorAll('canvas')],owned=[];let raf=0,alive=true,index=0,last=0;
window.__manaV5={ready:false,threeStateOnly:true};
try{if(!q.has('verify')){q.set('verify','');history.replaceState(null,'',`${location.pathname}?${q}${location.hash}`);}
const base={h:Number(q.get('h')||64),mode:q.get('mode')||'normal',omit:q.get('omit')||'',diagnostic:q.get('diagnostic')||'normal',noActor:q.get('noActor')==='1'};
for(let i=0;i<phases.length;i++){const canvas=canvases[i]||document.getElementById('stage').appendChild(document.createElement('canvas'));canvas.width=360;canvas.height=240;canvas.classList.toggle('active',i===0);owned.push(await DvaManaV5Pilot.create({...base,canvas,phase:phases[i]}));}
if(owned.some(x=>!x.snapshot.ready))throw new Error(owned.flatMap(x=>x.snapshot.compilation?.errors||[]).join('\n')||'One or more pilot states failed to render');window.__manaV5={ready:true,states:owned.map(x=>x.snapshot),threeStateOnly:true};
function frame(now){if(!alive)return;if(!last||now-last>=900){index=(index+1)%phases.length;last=now;canvases.forEach((c,i)=>c.classList.toggle('active',i===index));document.getElementById('label').textContent=`Mana v5 pilot · unaccepted\nState ${index+1}/3 · H${base.h} · t=${phases[index].toFixed(2)}s · ${base.mode}\nSFX and full lifetime not included`;}raf=requestAnimationFrame(frame);}document.getElementById('label').textContent=`Mana v5 pilot · unaccepted\nState 1/3 · H${base.h} · t=${phases[0].toFixed(2)}s · ${base.mode}\nSFX and full lifetime not included`;raf=requestAnimationFrame(frame);
function cleanup(){if(!alive)return;alive=false;cancelAnimationFrame(raf);owned.forEach(x=>x.destroy());}window.addEventListener('pagehide',cleanup,{once:true});
}catch(e){alive=false;cancelAnimationFrame(raf);window.__manaV5={ready:false,error:String(e.stack||e),threeStateOnly:true};document.getElementById('error').textContent=String(e.stack||e);owned.forEach(x=>x.destroy());}})();
</script></html>
