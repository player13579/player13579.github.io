<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111c">
  <title>サンビーム E · プレビュー</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#09111c; color:#e8f3ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#09111c; }
    main { width:min(1120px,100%); margin:auto; padding:20px 12px 28px; }
    h1 { margin:0 0 12px; font-size:clamp(24px,4vw,34px); }
    .stage { width:980px; max-width:100%; aspect-ratio:980/620; overflow:hidden; border:1px solid #38536a; border-radius:8px; background:#091521; }
    canvas { display:block; width:100%; height:100%; }
    #status { margin:10px 0 0; color:#b9d0dc; font-size:13px; }
    #status:empty { display:none; }
  </style>
</head>
<body>
<main>
  <h1>サンビーム E</h1>
  <div class="stage"><canvas id="sunbeam" aria-label="サンビーム E の再生画面"></canvas></div>
  <p id="status" role="status"></p>
</main>
<script src="webgpu-frame-core.js?v=sunbeam-preview-v1"></script>
<script src="webgpu-primitives.js?v=sunbeam-preview-v1"></script>
<script src="webgpu-compositing.js?v=sunbeam-preview-v1"></script>
<script src="webgpu-renderer.js?v=sunbeam-preview-v1"></script>
<script src="webgpu-sunbeam-e.js?v=sunbeam-preview-v15"></script>
<script src="webgpu-sunbeam-e-sfx.js?v=sunbeam-preview-v2"></script>
<script src="webgpu-e-cue-player.js?v=sunbeam-preview-v1"></script>
<script src="webgpu-sunbeam-cue-adapter.js?v=sunbeam-preview-v1"></script>
<script src="sunbeam-webgpu-preview.js?v=sunbeam-preview-v3"></script>
</body>
</html>
