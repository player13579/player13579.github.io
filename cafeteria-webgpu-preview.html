<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101712">
  <title>実りの食堂 · WebGPU E プレビュー</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#101712; color:#e7eee8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; }
    main { width:min(980px,100%); margin:auto; padding:16px 12px 24px; }
    h1 { margin:0 0 10px; font-size:clamp(21px,4vw,30px); font-weight:650; }
    .stage { width:min(930px,100%); aspect-ratio:930/860; overflow:hidden; background:#1c241f; }
    canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
    #status { margin:9px 0 0; min-height:1.5em; color:#bfd0c3; font-size:13px; line-height:1.5; }
    #status:empty { display:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
<main>
  <h1>実りの食堂 · E 自動ループ</h1>
  <div class="stage"><canvas id="cafeteria" width="930" height="860" aria-label="実りの食堂の原画と WebGPU エフェクト"></canvas></div>
  <p id="status" role="status" aria-live="polite">読み込み中</p>
  <span class="sr-only">WebGPU プレビューは操作ボタンなしで自動再生します。音声は画面への最初のタップ後に有効になります。</span>
</main>
<script src="webgpu-frame-core.js?v=cafeteria-preview-v1"></script>
<script src="webgpu-primitives.js?v=cafeteria-preview-v1"></script>
<script src="webgpu-compositing.js?v=cafeteria-preview-v1"></script>
<script src="webgpu-renderer.js?v=cafeteria-preview-v1"></script>
<script src="webgpu-map-cafeteria-e.js?v=cafeteria-preview-v1"></script>
<script src="webgpu-map-cafeteria-e-sfx.js?v=cafeteria-preview-v1"></script>
<script src="cafeteria-webgpu-preview.js?v=cafeteria-preview-v1"></script>
</body>
</html>
