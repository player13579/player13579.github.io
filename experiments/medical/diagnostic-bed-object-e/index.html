<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>診療ベッド・オブジェクトE 試作</title>
<style>
  :root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif}
  body{margin:0;padding:20px;background:#101923;color:#edf5f7}
  main{max-width:760px;margin:auto}
  h1{font-size:1.25rem;margin:0 0 6px}
  p{margin:0 0 14px;color:#afc8d0}
  .stage{width:min(475px,100%);aspect-ratio:950/780;margin:auto;background:#28353b}
  canvas{display:block;width:100%;height:100%}
  .controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:15px auto}
  button{font:inherit;border:1px solid #5d919a;border-radius:7px;background:#21434c;color:#fff;padding:8px 12px;cursor:pointer}
  button:hover{background:#2d5862}button:focus-visible{outline:2px solid #b3f5e1;outline-offset:2px}
  button:disabled{opacity:.5;cursor:default}
  #status{text-align:center;min-height:24px;color:#bce7dd}
  #error{white-space:pre-wrap;color:#ffb5a9}
</style>
<main>
  <h1>診療ベッドのオブジェクトE</h1>
  <p>実際のゲーム表示に近い半分サイズ。使用すると左右の支持部が同期し、緩和の脈動をベッド面へ送り、加速の流れが足側へ抜けます。</p>
  <div class="stage"><canvas id="view" width="950" height="780" aria-label="診療ベッドの使用時エフェクト"></canvas></div>
  <div class="controls">
    <button id="activate" type="button" disabled>使用・再生</button>
    <button id="idle" type="button" disabled>待機へ戻す</button>
    <button id="audio" type="button" aria-pressed="false">音を有効にする</button>
  </div>
  <div id="status" role="status">WebGPUを初期化中</div>
  <pre id="error" role="alert"></pre>
</main>
<script type="module">
const SOURCE = '../medical-chatgpt-attempt2-b.png';
const query = new URLSearchParams(location.search);
const verify = query.has('verify');
const probeFrame = verify && query.has('frame') ? Math.max(0, Math.min(0.9, Number(query.get('frame')))) : NaN;
const canvas = document.querySelector('#view');
const status = document.querySelector('#status');
const errorBox = document.querySelector('#error');
const activateButton = document.querySelector('#activate');
const idleButton = document.querySelector('#idle');
const audioButton = document.querySelector('#audio');
const DURATION = 0.9;
let device, audioContext, audioEnabled = false, activationStart = -1, activeSound = null, gpuLost = false;
// The accepted map image is sampled once as the base. All new E marks are WGSL geometry.
const shader = /* wgsl */`
struct Params { elapsed:f32, width:f32, height:f32, reduced:f32 }
@group(0) @binding(0) var baseImage: texture_2d<f32>;
@group(0) @binding(1) var<uniform> params: Params;
struct Out { @builtin(position) position:vec4<f32>, @location(0) uv:vec2<f32> }
@vertex fn vs(@builtin(vertex_index) i:u32)->Out {
  var v=array<vec2<f32>,3>(vec2<f32>(-1.0,-1.0),vec2<f32>(3.0,-1.0),vec2<f32>(-1.0,3.0));
  var o:Out; o.position=vec4<f32>(v[i],0.0,1.0); o.uv=v[i]*0.5+vec2<f32>(0.5); return o;
}
fn rr(p:vec2<f32>,c:vec2<f32>,h:vec2<f32>,r:f32)->f32 {
  let q=abs(p-c)-h+vec2<f32>(r);
  return length(max(q,vec2<f32>(0.0)))+min(max(q.x,q.y),0.0)-r;
}
fn gate(t:f32,a:f32,b:f32,c:f32,d:f32)->f32 {
  return smoothstep(a,b,t)*(1.0-smoothstep(c,d,t));
}
fn line(y:f32,center:f32,width:f32)->f32 { return exp(-pow((y-center)/width,2.0)); }
@fragment fn fs(input:Out)->@location(0) vec4<f32> {
  let texSize=textureDimensions(baseImage);
  let imageUv=vec2<f32>(input.uv.x,1.0-input.uv.y);
  let texPx=clamp(vec2<i32>(imageUv*vec2<f32>(texSize)),vec2<i32>(0),vec2<i32>(texSize)-vec2<i32>(1));
  let base=textureLoad(baseImage,texPx,0);
  let p=input.position.xy*vec2<f32>(950.0/params.width,780.0/params.height);
  var t=params.elapsed*(3.35/0.9);
  if (params.reduced > 0.5) { t=2.35; }
  if (t < 0.0 || t > 3.35) { return vec4<f32>(base.rgb,1.0); }
  var color=base.rgb;
  let railMask=1.0-smoothstep(-1.0,3.0,rr(p,vec2<f32>(230.0,211.0),vec2<f32>(92.0,53.0),12.0));
  let bedMask=1.0-smoothstep(-2.0,4.0,rr(p,vec2<f32>(231.0,211.0),vec2<f32>(80.0,37.0),15.0));
  // 1. Side supports wake from the actual bed rails, then draw inward as one breath.
  let wake=gate(t,0.04,0.23,2.52,3.08);
  let upper=line(p.y,163.0,6.0)*smoothstep(142.0,155.0,p.x)*(1.0-smoothstep(305.0,318.0,p.x));
  let lower=line(p.y,261.0,6.0)*smoothstep(142.0,155.0,p.x)*(1.0-smoothstep(305.0,318.0,p.x));
  let inward=clamp((t-0.27)/0.78,0.0,1.0);
  let breathUpper=line(p.y,167.0+inward*28.0,8.0)*bedMask;
  let breathLower=line(p.y,255.0-inward*28.0,8.0)*bedMask;
  let breath=gate(t,0.30,0.45,1.04,1.38)*(breathUpper+breathLower);
  let railLight=(upper+lower)*wake*railMask;
  // 2. A single broad wave travels from the pillow end to the foot end.
  let flowPhase=clamp((t-1.15)/1.48,0.0,1.0);
  let front=156.0+flowPhase*155.0;
  let angled=p.x-front+abs(p.y-211.0)*0.23;
  let broad=exp(-pow(angled/25.0,2.0))*bedMask;
  let brightEdge=exp(-pow(angled/6.0,2.0))*bedMask;
  let stream=gate(t,1.16,1.34,2.58,2.92)*broad;
  let streamCore=gate(t,1.16,1.34,2.58,2.92)*brightEdge;
  let tail=gate(t,1.50,1.72,2.83,3.14)*(line(p.y,189.0,5.0)+line(p.y,233.0,5.0))*bedMask*clamp((front-p.x)/48.0,0.0,1.0);
  // Spatial glow spreads off the emitter; the hard wave stays clipped to the mattress.
  let glow=exp(-pow((p.x-front)/42.0,2.0)-pow((p.y-211.0)/49.0,2.0))*gate(t,1.17,1.36,2.64,2.96);
  let railGlow=(exp(-pow((p.y-163.0)/15.0,2.0))+exp(-pow((p.y-261.0)/15.0,2.0)))*wake*railMask*0.16;
  let energized=gate(t,0.17,0.38,2.84,3.23)*bedMask;
  color=mix(color,vec3<f32>(0.22,0.51,0.54),energized*0.36);
  color=mix(color,vec3<f32>(0.02,0.38,0.43),clamp(railLight*0.84+breath*0.58,0.0,0.86));
  color=mix(color,vec3<f32>(0.01,0.29,0.37),clamp(stream*0.88+tail*0.48,0.0,0.88));
  color=mix(color,vec3<f32>(0.87,1.0,0.47),streamCore*0.90);
  color += vec3<f32>(0.16,0.86,0.61)*railGlow*1.35;
  color += vec3<f32>(0.21,0.90,0.68)*glow*0.34;
  let settle=gate(t,2.55,2.77,3.08,3.35)*line(p.y,211.0,15.0)*bedMask;
  color += vec3<f32>(0.22,0.72,0.52)*settle*0.16;
  return vec4<f32>(color,1.0);
}`;
function setStatus(now) {
  const elapsed=activationStart<0?-1:(now-activationStart)/1000;
  if (elapsed>DURATION) { activationStart=-1; status.textContent='待機中'; }
  else if (elapsed<0) status.textContent='待機中';
  else if (elapsed<0.31) status.textContent='支持部が同期・緩和';
  else if (elapsed<0.78) status.textContent='加速の流れを送出';
  else status.textContent='完了';
  return activationStart<0?-1:(now-activationStart)/1000;
}
function stopSound() {
  if (!activeSound) return;
  try { activeSound.stop(); } catch {}
  activeSound=null;
}
function sound() {
  if (verify || !audioEnabled || !audioContext || audioContext.state!=='running') return;
  const at=audioContext.currentTime;
  // One finite rising cue responds to use; replay replaces the prior cue.
  stopSound();
  const osc=audioContext.createOscillator(), gain=audioContext.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(190,at);
  osc.frequency.exponentialRampToValueAtTime(430,at+0.24);
  gain.gain.setValueAtTime(0,at);
  gain.gain.linearRampToValueAtTime(0.014,at+0.025);
  gain.gain.exponentialRampToValueAtTime(0.0001,at+0.26);
  osc.connect(gain); gain.connect(audioContext.destination);
  activeSound=osc;
  osc.start(at); osc.stop(at+0.26);
  osc.onended=()=>{if (activeSound===osc) activeSound=null;osc.disconnect();gain.disconnect();};
}
async function start() {
  if (!navigator.gpu) throw new Error('WebGPUを利用できません。');
  const adapter=await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('WebGPU adapterを取得できません。');
  device=await adapter.requestDevice();
  const response=await fetch(SOURCE);
  if (!response.ok) throw new Error(`採用画像を読み込めません: ${response.status} ${SOURCE}`);
  const bitmap=await createImageBitmap(await response.blob());
  const texture=device.createTexture({size:[bitmap.width,bitmap.height],format:'rgba8unorm',usage:GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST|GPUTextureUsage.RENDER_ATTACHMENT});
  device.queue.copyExternalImageToTexture({source:bitmap},{texture},[bitmap.width,bitmap.height]);
  bitmap.close();
  const context=canvas.getContext('webgpu');
  if (!context) throw new Error('WebGPU canvas contextを作成できません。');
  const format=navigator.gpu.getPreferredCanvasFormat();
  context.configure({device,format,alphaMode:'opaque'});
  const module=device.createShaderModule({code:shader});
  const info=await module.getCompilationInfo();
  const errors=info.messages.filter(message=>message.type==='error');
  if (errors.length) throw new Error(errors.map(message=>`${message.lineNum}:${message.linePos} ${message.message}`).join('\n'));
  const uniform=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  const pipeline=device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});
  const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:texture.createView()},{binding:1,resource:{buffer:uniform}}]});
  activateButton.disabled=false; idleButton.disabled=false;
  device.lost.then(()=>{gpuLost=true;activateButton.disabled=true;idleButton.disabled=true;status.textContent='WebGPUデバイスが失われました';});
  function frame(now) {
    if (gpuLost) return;
    const elapsed=Number.isFinite(probeFrame)?probeFrame:setStatus(now);
    if (Number.isFinite(probeFrame)) status.textContent=`検証フレーム ${probeFrame.toFixed(2)}秒・無音`;
    device.queue.writeBuffer(uniform,0,new Float32Array([elapsed,950,780,matchMedia('(prefers-reduced-motion: reduce)').matches?1:0]));
    const encoder=device.createCommandEncoder();
    const pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:[0,0,0,1]}]});
    pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.draw(3);pass.end();
    device.queue.submit([encoder.finish()]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
activateButton.addEventListener('click',()=>{activationStart=performance.now();sound();});
idleButton.addEventListener('click',()=>{activationStart=-1;stopSound();});
audioButton.addEventListener('click',async()=>{
  if (verify) return;
  if (audioEnabled) {audioEnabled=false;stopSound();await audioContext?.suspend();audioButton.textContent='音を有効にする';audioButton.setAttribute('aria-pressed','false');return;}
  try { const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('Audio unavailable');
    audioContext??=new AudioContextClass();await audioContext.resume();audioEnabled=true;
    audioButton.textContent='音を消す';audioButton.setAttribute('aria-pressed','true');
  } catch {audioButton.textContent='音を利用できません';audioButton.disabled=true;}
});
if (verify) {audioButton.disabled=true;audioButton.textContent='検証中は無音';}
start().catch(error=>{errorBox.textContent=`WebGPU preview failed\n${error.stack||error}`;status.textContent='起動失敗';canvas.hidden=true;});
</script>
</html>
