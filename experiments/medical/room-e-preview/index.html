<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医療室 E・統合プレビュー</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:18px;background:#0f1920;color:#e6f4f2}main{max-width:770px;margin:auto}h1{font-size:1.3rem;margin:0 0 5px}p{margin:0 0 12px;color:#b2ccca}.stage{width:min(475px,100%);aspect-ratio:950/780;margin:auto;background:#263337}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:14px auto}button{font:inherit;border:1px solid #4b8587;background:#1b3b45;color:#e6f4f2;border-radius:7px;padding:7px 10px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#34636a}button:disabled{opacity:.55;cursor:default}button:focus-visible{outline:2px solid #c8ee9b;outline-offset:2px}#status{text-align:center;min-height:24px;color:#bdebd0}#error{white-space:pre-wrap;color:#ffb0a0}body.verify .controls{display:none}
</style>
<main>
<h1>医療室 E・統合プレビュー</h1>
<p>採用済みの部屋画像に、環境、診療ベッド、薬品棚、足湯、アップロード装置、手洗い場、患者椅子の E を重ねた半サイズ表示です。各ボタンで発生箇所を確認できます。</p>
<div class="stage"><canvas id="view" width="950" height="780" aria-label="医療室全体の WebGPU エフェクト"></canvas></div>
<div class="controls" id="controls">
<button data-scene="all" aria-pressed="true">全体</button><button data-scene="ambient">環境</button><button data-scene="bed">診療ベッド</button><button data-scene="cabinet">薬品棚</button><button data-scene="bath">足湯</button><button data-scene="upload">アップロード</button><button data-scene="sink">手洗い場</button><button data-scene="chair">患者椅子</button><button id="audio" aria-pressed="false">音を有効にする</button>
</div>
<div id="status" role="status">WebGPU 初期化中</div><pre id="error" role="alert"></pre>
</main>
<script src="./vendor/webgpu-medical-environment-e.js"></script>
<script src="./vendor/webgpu-medical-object-e.js"></script>
<script src="./vendor/webgpu-medical-cabinet-e.js"></script>
<script src="./vendor/webgpu-medical-footbath-use-e.js"></script>
<script src="./vendor/webgpu-medical-upload-console-e.js"></script>
<script src="./vendor/webgpu-medical-fixture-e.js"></script>
<script type="module" src="./preview.js"></script>
</html>
