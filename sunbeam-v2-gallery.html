<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>サンビーム · WebGPU E</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05090d;color:#d9ebef;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center}main{position:relative;width:min(100vw,158.0645vh);height:min(100vh,63.2653vw);background:radial-gradient(ellipse at 49% 52%,#172631 0%,#0b1219 58%,#05090d 100%)}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}.error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#ffd6c9;background:#080e14eF;text-align:center;line-height:1.55;white-space:pre-wrap}.error[hidden]{display:none}
</style>
</head>
<body>
<main aria-label="サンビーム WebGPU エフェクト">
  <canvas id="stage" aria-label="サンビームエフェクトをループ再生"></canvas>
  <div class="error" id="error" role="status" hidden></div>
</main>
<script type="module" src="sunbeam-v2-gallery.js"></script>
</body>
</html>
