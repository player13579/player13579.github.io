<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マナ獲得 Astra clean v2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070a11;color:#d9e9f5;font:14px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:18px 16px}h1{font-size:18px;font-weight:600;margin:0 0 8px}p{font-size:12px;color:#8c9eb4;margin:7px 0;line-height:1.6}canvas{display:block;width:100%;height:300px;border-radius:12px}.labels{display:flex;justify-content:space-around;margin-top:-40px;position:relative;font-size:12px;color:#8bafd0;pointer-events:none}.status{margin-top:42px}.embed main{padding:8px 4px}.embed h1,.embed .intro{display:none}</style>
<main><h1>マナ獲得 · Astra clean v2</h1><p class="intro">立体的な凝縮体の吸収と、胸腹の内部への蓄積。新規候補の自動再生。</p><canvas aria-label="WebGPU マナ獲得 H100 H64"></canvas><div class="labels"><span>H100</span><span>H64</span></div><p class="status" id="status">WebGPUを準備中</p><p>制作候補・本編未接続・ユーザー採用前</p></main>
<script src="webgpu-mana-astra-clean-v2.js"></script><script>
(()=>{'use strict';const params=new URLSearchParams(location.search);if(params.has('embed'))document.body.classList.add('embed');const verify=params.has('verify'),api=DvaManaAstraCleanV2,canvas=document.querySelector('canvas'),status=document.getElementById('status'),audio=api.sound({verify,mute:params.has('mute')}),reduced=params.has('reduced')||matchMedia('(prefers-reduced-motion: reduce)').matches;
let gpu=null,start=performance.now(),raf=0,closed=false,cycle=-1;const receipts=[];
function loop(now){if(closed)return;const ms=now-start,index=Math.floor(ms/2400),phase=(ms%2400)/1500;if(index!==cycle){cycle=index;if(!document.hidden)audio.play('mana-v2-'+cycle);}gpu.draw(phase,{reduced});if(receipts.length<900)receipts.push({wallMs:ms,...gpu.receipt});raf=requestAnimationFrame(loop);}
async function dispose(){if(closed)return;closed=true;cancelAnimationFrame(raf);gpu?.dispose();await audio.dispose();}
addEventListener('pagehide',dispose,{once:true});addEventListener('pointerdown',()=>audio.unlock(),{once:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden){start=performance.now();cycle=-1;}});
api.renderer(canvas).then(r=>{if(closed){r.dispose();return;}gpu=r;status.textContent=verify?'WebGPU · 自動再生 · 検証音声0固定':'WebGPU · 自動再生 · タッチ後に音声';window.manaV2={gpu,audio,receipts,dispose,async at(phase,options={}){cancelAnimationFrame(raf);gpu.draw(phase,{reduced,...options});await gpu.settle();return gpu.receipt;},resume(){cancelAnimationFrame(raf);start=performance.now();cycle=-1;raf=requestAnimationFrame(loop);}};document.documentElement.dataset.ready='true';start=performance.now();raf=requestAnimationFrame(loop);}).catch(error=>{document.documentElement.dataset.error=error.message;status.textContent='WebGPUエラー: '+error.message;});})();
</script></html>
