<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire E · second generation</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #10151d; color: #e9edf3; }
    main { width: min(1100px, 100%); margin: auto; padding: 24px 20px 42px; }
    h1 { margin: 4px 0 6px; font-size: 34px; letter-spacing: -.035em; }
    .eyebrow { color: #f2a061; font-size: 11px; font-weight: 750; letter-spacing: .17em; }
    p { color: #aebbc8; line-height: 1.55; max-width: 850px; }
    .scroll { overflow-x: auto; }
    .stage { position: relative; width: 980px; height: 620px; background: #1b222c; overflow: hidden; border: 1px solid #3b4654; }
    .stage::before { content: ""; position: absolute; left: 0; right: 0; top: 59%; height: 1px; background: #45505a; opacity: .4; }
    canvas { position: absolute; inset: 0; width: 980px; height: 620px; display: block; }
    .stage-label, .status { position: absolute; z-index: 1; left: 18px; font-size: 12px; pointer-events: none; }
    .stage-label { top: 15px; color: #bbc6d0; }
    .status { bottom: 13px; color: #9cabb8; }
    .controls { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: end; gap: 14px 22px; padding: 16px; background: #1c2530; border: 1px solid #344050; border-radius: 8px; }
    label { display: grid; gap: 5px; font-size: 12px; min-width: 150px; }
    label b { font-weight: 500; color: #ffbd7e; }
    input[type=range] { accent-color: #ed8240; width: 170px; }
    label.toggle { display: flex; align-items: center; min-width: unset; gap: 7px; }
    button { border: 0; border-radius: 5px; background: #e9833d; color: #19110a; padding: 10px 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">DEFENDERS VS ATTACKERS · WEBGPU E CANDIDATE</div>
  <h1>Fire / 発火 · 第二案</h1>
  <p>発動点から火が立ち、熱が床沿いに伝わり、上昇流と火の粉へ移る1,500 ms。テクスチャを使わないWebGPU描画をゲーム実寸で確認します。</p>
  <div class="scroll"><div class="stage">
    <canvas id="fire" width="980" height="620" aria-label="WebGPU Fire E"></canvas>
    <div class="stage-label">980 × 620 GAMEPLAY SIZE · RESOLVED RADIUS</div>
    <div class="status" id="status">WebGPU 初期化中</div>
  </div></div>
  <div class="controls">
    <button id="replay">再生</button><button id="pause">一時停止</button>
    <label>時間 <b id="age-label"></b><input id="age" type="range" min="0" max="1.5" step="0.01" value="0.72"></label>
    <label>効果半径 <b id="radius-label"></b><input id="radius" type="range" min="180" max="315" step="1" value="240"></label>
    <label>Seed <b id="seed-label"></b><input id="seed" type="range" min="1" max="32" step="1" value="4"></label>
    <label class="toggle"><input id="reduced" type="checkbox">動きを減らす</label>
  </div>
  <p>単発の <code>fire</code> 発動候補。プレビューでは音声を常に0に固定します。ゲームで採用する場合も既存の <code>fireJutsu</code> 音と1500 msのイベント寿命を保ちます。</p>
</main>
<script type="module">
  import { createFireUltra } from './webgpu-fire-ultra.js';
  const query = new URLSearchParams(location.search);
  const verify = query.has('verify');
  window.__fireAudioGain = 0;
  window.__fireVerifyMode = verify;
  const controls = Object.fromEntries(['replay','pause','age','radius','seed','reduced','status']
    .map(id => [id, document.getElementById(id)]));
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  controls.reduced.checked = query.has('reduced') ? query.get('reduced') !== '0' : motionPreference.matches;
  if (query.has('radius')) controls.radius.value = String(Math.max(180, Math.min(315, Number(query.get('radius')) || 240)));
  if (query.has('seed')) controls.seed.value = String(Math.max(1, Math.min(32, Number(query.get('seed')) || 4)));
  let age = query.has('age') ? Math.max(0, Math.min(1.5, Number(query.get('age')) || 0)) : 0.72;
  let paused = verify || controls.reduced.checked;
  let last = performance.now();
  const label = () => {
    controls.age.value = String(age);
    document.getElementById('age-label').textContent = `${age.toFixed(2)} s`;
    document.getElementById('radius-label').textContent = controls.radius.value;
    document.getElementById('seed-label').textContent = controls.seed.value;
    controls.pause.textContent = paused ? '再開' : '一時停止';
  };
  try {
    const renderer = await createFireUltra(document.getElementById('fire'));
    window.__fireUltraReady = true;
    window.__fireUltraRenderer = renderer;
    controls.status.textContent = 'WebGPU · procedural flame / heat / ember · premultiplied alpha';
    function frame(now) {
      const delta = Math.min(0.05, (now - last) / 1000); last = now;
      if (!paused) age = (age + delta) % 1.85;
      renderer.render({ age: Math.min(1.5, age), radius: Number(controls.radius.value),
        seed: Number(controls.seed.value), reducedMotion: controls.reduced.checked });
      label(); requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } catch (error) {
    controls.status.textContent = String(error);
    window.__fireUltraError = String(error);
  }
  controls.replay.onclick = () => { age = controls.reduced.checked ? 0.72 : 0; paused = controls.reduced.checked; last = performance.now(); };
  controls.pause.onclick = () => { paused = controls.reduced.checked ? true : !paused; last = performance.now(); };
  controls.age.oninput = () => { age = Number(controls.age.value); paused = true; };
  controls.radius.oninput = label;
  controls.seed.oninput = label;
  controls.reduced.onchange = () => { paused = controls.reduced.checked; age = 0.72; last = performance.now(); };
  label();
</script>
</body>
</html>
